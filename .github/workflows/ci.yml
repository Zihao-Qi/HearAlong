# A fresh checkout must pass: type check, lint and the public guard (Linux), unit tests and the isolated browser suites
# (Apple Silicon Mac). Parallel jobs, so one stalled part cannot hold the others and a failure names its part.
# The browser suites run in three shards (browser-suites), and the small `browser` job reports them as the one required check.
# A pull request so runs 4 macOS jobs at once (unit and 3 shards); free accounts get 5 concurrent macOS jobs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Pull requests: only the newest push runs. Main: every commit gets its own complete run, never cancelled or superseded.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Static and unit run on every pull request and push, docs-only ones too: unit tests read the docs
  # (bench.test.ts, read-scope-disclosure.test.ts, land.test.ts).
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22' # Latest 22.x; package.json requires >=22.19.0.
      # One cache per runner OS, shared by static, unit and the browser shards; the first job that misses saves it.
      # npm's own cache is not used: it has the same lockfile key, so it could only hit when this one does.
      - id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/package-lock.json') }}
      # Pinned to the shellcheck release Homebrew ships on macOS (Ubuntu's apt has 0.9.0, which reports different notes).
      - run: pipx install shellcheck-py==0.11.0.1 && shellcheck --version
      - run: sudo apt-get install -y --no-install-recommends zsh # lint-shell.sh also syntax-checks the zsh scripts
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run lint
      # Its fixtures write their own fictional deny list, so the private one is not needed.
      - name: Public guard tests
        working-directory: .
        run: node --test app/scripts/public-guard.test.cjs

  unit:
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22' # Latest 22.x; package.json requires >=22.19.0.
      - id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/package-lock.json') }}
      # Xcode's swiftc (PDF text tool), cupsfilter, git, ps and zsh come with the runner.
      - run: brew install ffmpeg
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_ANALYTICS: 1
          HOMEBREW_NO_ENV_HINTS: 1
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test

  # Pull requests only: is anything besides documentation changed? Any doubt (an API error, no file list) means yes.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        # A rename counts both names, so moving code into docs/ still runs the suites.
        run: |
          code=true
          if files=$(gh api --paginate "repos/$REPO/pulls/$NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)') && [ -n "$files" ]; then
            printf '%s\n' "$files"
            if ! grep -Eqv '^(docs/.+|[^/]+\.md|LICENSE|THIRD-PARTY-LICENSES)$' <<< "$files"; then code=false; fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  # Pull requests only: a merge to main reruns static and unit, not the same suites the pull request just passed.
  browser-suites:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 60 # the suites run two at a time, up to 30 minutes each
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22' # Latest 22.x; package.json requires >=22.19.0.
      - id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/package-lock.json') }}
      - run: brew install ffmpeg
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_ANALYTICS: 1
          HOMEBREW_NO_ENV_HINTS: 1
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      # Use the pinned Playwright's headless shell on the displayless runner. Full Chrome logged CVDisplayLink failures
      # during the first run, where plans-check reached the 20-minute limit.
      - name: Install test Chromium
        run: |
          npx --no-install playwright-core install --only-shell chromium
          chrome=$(node -e "
            const { dirname, join } = require('node:path'), { homedir } = require('node:os');
            const { browsers } = require(join(dirname(require.resolve('playwright-core/package.json')), 'browsers.json'));
            const { revision } = browsers.find(b => b.name === 'chromium-headless-shell');
            process.stdout.write(join(homedir(), 'Library/Caches/ms-playwright', 'chromium_headless_shell-' + revision, 'chrome-headless-shell-mac-arm64', 'chrome-headless-shell'));")
          test -x "$chrome"
          echo "MEETING_TEST_CHROME=$chrome" >> "$GITHUB_ENV"
      # Allow shared-runner headroom beyond the first run's 20-minute per-suite limit.
      - name: Isolated suites
        env:
          MEETING_CHECK_TIMEOUT_S: 1800
          MEETING_CHECKS_BROWSER_ONLY: '1' # the static and unit jobs already run the type check and unit tests
          MEETING_CHECKS_SHARD: ${{ matrix.shard }}/3
        run: npm run checks -- "$RUNNER_TEMP/checks"
      - name: Summary
        if: always()
        run: cat "$RUNNER_TEMP/checks/summary.txt" 2>/dev/null || echo 'No summary was written.'
      # Logs, screenshots and summary only: the suites' isolated HOME/temporary folders and any data folder stay behind.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: checks-output-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/checks
            !${{ runner.temp }}/checks/home/**
            !${{ runner.temp }}/checks/tmp/**
            !${{ runner.temp }}/checks/**/data/**
          if-no-files-found: ignore
          retention-days: 7

  # The required `browser` check: passes for a docs-only pull request, otherwise only when every shard passed.
  browser:
    needs: [changes, browser-suites]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          SUITES: ${{ needs.browser-suites.result }}
        run: |
          echo "changes=$CHANGES code=$CODE browser-suites=$SUITES"
          if [ "$CHANGES" != success ]; then echo 'The changes job did not succeed.'; exit 1; fi
          if [ "$CODE" = false ]; then echo 'Docs-only pull request: the browser suites are not needed.'; exit 0; fi
          if [ "$SUITES" != success ]; then echo 'The browser suites did not all pass.'; exit 1; fi
