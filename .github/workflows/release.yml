name: Release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Release checklist: stored-data changes must add an upgrade fixture generated by the previous release.
      - name: Package tracked source
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          # git archive fixes metadata to the tagged commit; gzip -n omits host timestamps.
          git archive --format=tar "$GITHUB_SHA" app install.sh LICENSE THIRD-PARTY-LICENSES |
            gzip -n > "$RUNNER_TEMP/release/HearAlong.tar.gz"
          tar -tzf "$RUNNER_TEMP/release/HearAlong.tar.gz" > "$RUNNER_TEMP/release/contents"
          if ! awk '
            /^\// || /(^|\/)\.\.($|\/)/ || /(^|\/)(private|data|node_modules|dist)($|\/)/ { bad=1 }
            !/^(app\/|install\.sh$|LICENSE$|THIRD-PARTY-LICENSES\/)/ { bad=1 }
            END { exit bad }
          ' "$RUNNER_TEMP/release/contents"; then
            echo "Unexpected paths in release archive" >&2
            exit 1
          fi
          rm "$RUNNER_TEMP/release/contents"
          tar -tvzf "$RUNNER_TEMP/release/HearAlong.tar.gz" > "$RUNNER_TEMP/release/listing"
          if ! awk '
            /^[lh]/ || / -> / || / link to / { bad=1 }
            END { exit bad }
          ' "$RUNNER_TEMP/release/listing"; then
            echo "Links are not permitted in release archive" >&2
            exit 1
          fi
          rm "$RUNNER_TEMP/release/listing"
          cp install.sh "$RUNNER_TEMP/release/install.sh"
          cd "$RUNNER_TEMP/release"
          sha256sum HearAlong.tar.gz > HearAlong.tar.gz.sha256
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Ref $GITHUB_REF_NAME is not a valid vMAJOR.MINOR.PATCH(-suffix) tag" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" =~ - ]]; then
            FLAGS=(--prerelease --latest=false)
          else
            FLAGS=(--latest)
          fi
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${FLAGS[@]}"
          else
            gh release edit "$GITHUB_REF_NAME" --verify-tag "${FLAGS[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber \
            "$RUNNER_TEMP/release/HearAlong.tar.gz" \
            "$RUNNER_TEMP/release/HearAlong.tar.gz.sha256" \
            "$RUNNER_TEMP/release/install.sh"
