name: Release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    runs-on: macos-26 # Apple Silicon hosted runner
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.2'
      - name: Install pinned build tools
        run: |
          npm ci --prefix app/desktop --ignore-scripts
          ELECTRON_CACHE="$RUNNER_TEMP/electron-cache" node app/desktop/node_modules/electron/install.js
      - name: Build signed arm64 app and archive
        run: node app/desktop/scripts/package.cjs "$RUNNER_TEMP/desktop"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release
          path: |
            ${{ runner.temp }}/desktop/HearAlong-mac-arm64.zip
            ${{ runner.temp }}/desktop/HearAlong-mac-arm64.zip.sha256
          if-no-files-found: error
  release:
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Release checklist: stored-data changes must add an upgrade fixture generated by the previous release.
      - name: Prepare and verify installer
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          sh -n install.sh
          cp install.sh "$RUNNER_TEMP/release/install.sh"
          cmp install.sh "$RUNNER_TEMP/release/install.sh"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.0
        with:
          name: desktop-release
          path: ${{ runner.temp }}/release
      - name: Verify desktop archive checksum
        shell: bash
        run: cd "$RUNNER_TEMP/release" && sha256sum -c HearAlong-mac-arm64.zip.sha256
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Ref $GITHUB_REF_NAME is not a valid vMAJOR.MINOR.PATCH(-suffix) tag" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" =~ - ]]; then
            FLAGS=(--prerelease --latest=false)
          else
            FLAGS=(--latest)
          fi
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --draft
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber \
            "$RUNNER_TEMP/release/HearAlong-mac-arm64.zip" \
            "$RUNNER_TEMP/release/HearAlong-mac-arm64.zip.sha256" \
            "$RUNNER_TEMP/release/install.sh"
          ASSETS=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          for ASSET in HearAlong-mac-arm64.zip HearAlong-mac-arm64.zip.sha256 install.sh; do
            if ! grep -Fxq "$ASSET" <<< "$ASSETS"; then
              echo "Missing release asset: $ASSET" >&2
              exit 1
            fi
          done
          gh release edit "$GITHUB_REF_NAME" --verify-tag --draft=false "${FLAGS[@]}"
